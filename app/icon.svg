<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nexora">
  <defs>
    <!-- Obsidian tile -->
    <linearGradient id="nxTile" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#151F30"/>
      <stop offset="1" stop-color="#070A11"/>
    </linearGradient>
    <!-- Blue-to-violet accent with a cyan highlight at the leading edge -->
    <linearGradient id="nxGlyph" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#46D7E8"/>
      <stop offset="0.32" stop-color="#6EA8FF"/>
      <stop offset="1" stop-color="#9B8CFF"/>
    </linearGradient>
    <!-- Thin cyan edge light along the top bevel -->
    <linearGradient id="nxEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46D7E8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8BE6F2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded obsidian tile with a dark rim so the mark stays visible on both
       browser chrome and dark desktop surfaces -->
  <rect x="1" y="1" width="98" height="98" rx="24" fill="url(#nxTile)"/>
  <rect x="1" y="1" width="98" height="98" rx="24" fill="none" stroke="#AECDFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Thin cyan edge light -->
  <path d="M26 3.5 H74" stroke="url(#nxEdge)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Simplified luminous N: two vertical strokes and one diagonal bridge -->
  <g fill="url(#nxGlyph)">
    <path d="M26 28h14v44H26z"/>
    <path d="M60 28h14v44H60z"/>
    <path d="M26 28h14l34 44H60z"/>
  </g>
</svg>
