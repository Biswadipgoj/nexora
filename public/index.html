<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEXORA — Work & Project Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FAFBFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #0F172A;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .logo-frame {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      padding: 2px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0F172A;
    }
    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
      margin-top: 2px;
    }
    .loader-track {
      width: 120px;
      height: 3px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .loader-bar {
      width: 50%;
      height: 100%;
      background: #0F172A;
      border-radius: 999px;
      animation: slide-bar 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes slide-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>
  <script>
    if (window.location.pathname.endsWith('index.html')) {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <div class="splash-container">
    <div class="logo-frame">
      <img src="/logo.svg" alt="NEXORA" class="logo-img">
    </div>
    <div>
      <h1 class="brand-title">NEXORA</h1>
      <p class="tagline">Work • Plan • Build</p>
    </div>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
