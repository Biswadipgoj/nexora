<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F2F2EE;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1B1C19;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    .logo-frame {
      width: 56px;
      height: 56px;
    }
    .logo-img {
      width: 100%;
      height: 100%;
    }
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #1B1C19;
    }
    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: #6A6D64;
      margin-top: 2px;
    }
    .loader-track {
      width: 120px;
      height: 3px;
      background: #E2E2DB;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .loader-bar {
      width: 50%;
      height: 100%;
      background: #26375F;
      border-radius: 999px;
      animation: slide-bar 1.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes slide-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-bar { animation: none; width: 100%; opacity: 0.4; }
    }
  </style>
  <script>
    if (window.location.pathname.endsWith('index.html')) {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <div class="splash-container">
    <div class="logo-frame">
      <img src="/logo.svg" alt="Nexora" class="logo-img">
    </div>
    <div>
      <h1 class="brand-title">Nexora</h1>
      <p class="tagline">Opening your workspace…</p>
    </div>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>
</body>
</html>
