name: Build Android APK (Cloud)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'SETUP_GUIDE.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Cloud Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 📄 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 📦 Install Node Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🏗️ Build Next.js Production Assets
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: |
          npm run build

      - name: 🔄 Sync Web Assets to Capacitor Android
        run: |
          npx cap sync android

      - name: 🔑 Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew

      - name: ⚙️ Compile Android APK in Cloud
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
          if-no-files-found: error
